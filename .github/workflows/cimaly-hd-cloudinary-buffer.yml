name: Cimaly HD Cloudinary Buffer

on:
  workflow_dispatch:
    inputs:
      publish_now:
        description: "Publish now? true / false"
        required: true
        default: "false"

jobs:
  upload-and-publish:
    runs-on: ubuntu-latest

    env:
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_FACEBOOK_PROFILE_ID: ${{ secrets.BUFFER_CHANNEL_ID_FACEBOOK }}
      BUFFER_INSTAGRAM_PROFILE_ID: ${{ secrets.BUFFER_CHANNEL_ID_INSTAGRAM }}

      PUBLISH_NOW: ${{ github.event.inputs.publish_now }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Upload HD images to Cloudinary
        run: node scripts/upload-hd-to-cloudinary.js

      - name: Publish Cloudinary images to Buffer
        run: node scripts/publish-buffer-from-cloudinary.js

      - name: Show Cloudinary URLs
        run: cat artifacts/cloudinary-urls.json
