name: Cimaly Social Test

on:
  workflow_dispatch:
    inputs:
      publish_now:
        description: "Publier immédiatement ? true / false"
        required: true
        default: "false"

jobs:
  upload-and-publish:
    runs-on: ubuntu-latest

    env:
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
      BUFFER_FACEBOOK_PROFILE_ID: ${{ secrets.BUFFER_FACEBOOK_PROFILE_ID }}
      BUFFER_INSTAGRAM_PROFILE_ID: ${{ secrets.BUFFER_INSTAGRAM_PROFILE_ID }}

      PUBLISH_NOW: ${{ github.event.inputs.publish_now }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Upload images to Cloudinary
        run: node scripts/upload-social-to-cloudinary.js

      - name: Publish to Buffer
        run: node scripts/publish-buffer-social.js

      - name: Show Cloudinary URLs
        run: cat artifacts/cloudinary-urls.json
