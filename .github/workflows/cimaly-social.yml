name: Cimaly Daily Social Selection

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: cimaly-daily-social-selection
  cancel-in-progress: false

jobs:
  select-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync persistent published history
        shell: bash
        run: |
          set -euo pipefail
          if [ -f data/published-social-history.json ]; then
            cp data/published-social-history.json data/social-history.json
            echo "✅ Published history synced into picker history"
          else
            echo '{"items":[]}' > data/social-history.json
            echo "ℹ️ No published history yet; starting clean"
          fi

      - name: Select today's exact TMDB content
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/cimaly-social.js

      - name: Verify required TMDB data
        shell: bash
        run: |
          set -euo pipefail
          for key in morning_series afternoon_anime evening_movie; do
            title=$(jq -r ".${key}.title_en // empty" data/last-social-selection.json)
            overview=$(jq -r ".${key}.overview_en // empty" data/last-social-selection.json)
            id=$(jq -r ".${key}.tmdb_id // empty" data/last-social-selection.json)
            url=$(jq -r ".${key}.cimaly_url // empty" data/last-social-selection.json)
            if [ -z "$id" ] || [ -z "$title" ] || [ -z "$overview" ] || [ -z "$url" ]; then
              echo "❌ Missing TMDB ID, title, story or Cimaly URL for $key"
              exit 1
            fi
          done
          echo "✅ Today's 3 contents are ready for ChatGPT visuals"

      - name: Commit selection only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cimaly-social-bot"
          git config user.email "actions@github.com"

          git add -- data/last-social-selection.json data/social-history.json

          if git diff --cached --quiet; then
            echo "No selection changes"
          else
            git commit -m "Select today's Cimaly social content"
            git push origin HEAD:main
          fi

      - name: Explain next stage
        run: |
          echo "✅ Selection complete."
          echo "Next stage is triggered only when data/social-image-urls.json is updated with the 6 new ChatGPT image URLs."
          echo "No automatic poster generation and no Buffer publishing happens in this workflow."
