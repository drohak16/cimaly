name: Cimaly Social Dry Run

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-social:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test Buffer connection
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node scripts/buffer-test.js

      - name: Run Cimaly social test
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node scripts/cimaly-social.js

      - name: Save social history
        run: |
          git config user.name "cimaly-social-bot"
          git config user.email "actions@github.com"
          git add data/social-history.json
         
