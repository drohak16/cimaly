name: Cimaly Sharp Visual Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-social:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Sharp
        run: npm install sharp --no-save

      - name: Select Cimaly content
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/cimaly-social.js

      - name: Generate Cimaly Sharp visuals
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: node scripts/generate-social-images.js

      - name: Save generated images
        run: |
          git config user.name "cimaly-social-bot"
          git config user.email "actions@github.com"

          git add data/last-social-selection.json
          git add public/social

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Generate Cimaly Sharp social visuals"
          git push
