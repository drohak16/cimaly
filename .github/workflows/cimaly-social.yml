name: Cimaly Daily Social

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: cimaly-daily-social
  cancel-in-progress: false

jobs:
  cimaly-social:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync published history for TMDB picker
        shell: bash
        run: |
          set -euo pipefail
          if [ -f data/published-social-history.json ]; then
            cp data/published-social-history.json data/social-history.json
            echo "✅ Published history synced into picker history"
          else
            echo '{"items":[]}' > data/social-history.json
            echo "ℹ️ No published history yet; starting clean"
          fi

      - name: Select today's exact TMDB content
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/cimaly-social.js

      - name: Generate exact TMDB poster pack
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: node scripts/generate-social-images.js

      - name: Read exact selected TMDB IDs
        run: |
          echo "SERIES_TMDB_ID=$(jq -r '.morning_series.tmdb_id' data/last-social-selection.json)" >> "$GITHUB_ENV"
          echo "ANIME_TMDB_ID=$(jq -r '.afternoon_anime.tmdb_id' data/last-social-selection.json)" >> "$GITHUB_ENV"
          echo "MOVIE_TMDB_ID=$(jq -r '.evening_movie.tmdb_id' data/last-social-selection.json)" >> "$GITHUB_ENV"

      - name: Verify required TMDB stories exist
        shell: bash
        run: |
          set -euo pipefail
          for key in morning_series afternoon_anime evening_movie; do
            title=$(jq -r ".${key}.title_en // empty" data/last-social-selection.json)
            overview=$(jq -r ".${key}.overview_en // empty" data/last-social-selection.json)
            id=$(jq -r ".${key}.tmdb_id // empty" data/last-social-selection.json)
            if [ -z "$id" ] || [ -z "$title" ] || [ -z "$overview" ]; then
              echo "❌ Missing TMDB ID, title or story for $key"
              exit 1
            fi
          done
          echo "✅ Every selected title has its own TMDB story summary"

      - name: Commit today's selection and ID-bound images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cimaly-social-bot"
          git config user.email "actions@github.com"

          git add -- data/last-social-selection.json data/social-history.json
          git add -- "public/social/daily/en/series-${SERIES_TMDB_ID}.jpg"
          git add -- "public/social/daily/ar/series-${SERIES_TMDB_ID}.jpg"
          git add -- "public/social/daily/en/anime-${ANIME_TMDB_ID}.jpg"
          git add -- "public/social/daily/ar/anime-${ANIME_TMDB_ID}.jpg"
          git add -- "public/social/daily/en/movie-${MOVIE_TMDB_ID}.jpg"
          git add -- "public/social/daily/ar/movie-${MOVIE_TMDB_ID}.jpg"

          if git diff --cached --quiet; then
            echo "No daily content changes"
          else
            git commit -m "Prepare today's Cimaly TMDB social content"
            git push origin HEAD:main
          fi

      - name: Verify deployed ID-bound Cimaly image pack
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "en/series-${SERIES_TMDB_ID}.jpg"
            "ar/series-${SERIES_TMDB_ID}.jpg"
            "en/anime-${ANIME_TMDB_ID}.jpg"
            "ar/anime-${ANIME_TMDB_ID}.jpg"
            "en/movie-${MOVIE_TMDB_ID}.jpg"
            "ar/movie-${MOVIE_TMDB_ID}.jpg"
          )

          for attempt in $(seq 1 20); do
            echo "Deployment check attempt $attempt/20"
            all_ok=true

            for relative in "${files[@]}"; do
              local_file="public/social/daily/$relative"
              remote_file="/tmp/$(echo "$relative" | tr '/' '-')"
              remote_url="https://cimaly.cc/social/daily/$relative?v=${GITHUB_RUN_ID}-${attempt}"

              if ! curl --retry 2 --retry-delay 1 -fsSL "$remote_url" -o "$remote_file"; then
                all_ok=false
                break
              fi

              local_sha=$(sha256sum "$local_file" | awk '{print $1}')
              remote_sha=$(sha256sum "$remote_file" | awk '{print $1}')

              if [ "$local_sha" != "$remote_sha" ]; then
                echo "Not deployed yet: $relative"
                all_ok=false
                break
              fi
            done

            if [ "$all_ok" = true ]; then
              echo "✅ Exact TMDB-ID image pack is live on cimaly.cc"
              exit 0
            fi

            sleep 15
          done

          echo "❌ Latest ID-bound image pack did not become available on cimaly.cc"
          exit 1

      - name: Schedule Cimaly posts in Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID_FACEBOOK: ${{ secrets.BUFFER_CHANNEL_ID_FACEBOOK }}
          BUFFER_CHANNEL_ID_INSTAGRAM: ${{ secrets.BUFFER_CHANNEL_ID_INSTAGRAM }}
        run: |
          cp scripts/publish-buffer-daily.js /tmp/publish-buffer-daily.cjs
          node /tmp/publish-buffer-daily.cjs

      - name: Persist anti-duplicate publication history
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git config user.name "cimaly-social-bot"
          git config user.email "actions@github.com"

          git add -- data/published-social-history.json

          if git diff --cached --quiet; then
            echo "No publication history changes"
          else
            git commit -m "Record published Cimaly social content"
            git push origin HEAD:main
          fi
