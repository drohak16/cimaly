name: Import Cimaly Images

on:
  workflow_dispatch:
  push:
    paths:
      - "data/social-image-urls.json"

permissions:
  contents: write

concurrency:
  group: cimaly-image-import
  cancel-in-progress: false

jobs:
  import-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read image URLs
        run: |
          echo "SERIES_EN=$(jq -r '.series_en' data/social-image-urls.json)" >> "$GITHUB_ENV"
          echo "SERIES_AR=$(jq -r '.series_ar' data/social-image-urls.json)" >> "$GITHUB_ENV"
          echo "ANIME_EN=$(jq -r '.anime_en' data/social-image-urls.json)" >> "$GITHUB_ENV"
          echo "ANIME_AR=$(jq -r '.anime_ar' data/social-image-urls.json)" >> "$GITHUB_ENV"
          echo "MOVIE_EN=$(jq -r '.movie_en' data/social-image-urls.json)" >> "$GITHUB_ENV"
          echo "MOVIE_AR=$(jq -r '.movie_ar' data/social-image-urls.json)" >> "$GITHUB_ENV"

      - name: Validate URLs
        run: |
          for url in \
            "$SERIES_EN" \
            "$SERIES_AR" \
            "$ANIME_EN" \
            "$ANIME_AR" \
            "$MOVIE_EN" \
            "$MOVIE_AR"
          do
            if [ -z "$url" ] || [ "$url" = "null" ]; then
              echo "Missing image URL"
              exit 1
            fi

            case "$url" in
              http://*|https://*) ;;
              *)
                echo "Invalid image URL: $url"
                exit 1
                ;;
            esac
          done

      - name: Create folders
        run: |
          mkdir -p public/social/daily/en
          mkdir -p public/social/daily/ar

      - name: Download Cimaly images
        run: |
          curl --retry 3 --retry-delay 2 -fL "$SERIES_EN" -o public/social/daily/en/series.jpg
          curl --retry 3 --retry-delay 2 -fL "$SERIES_AR" -o public/social/daily/ar/series.jpg
          curl --retry 3 --retry-delay 2 -fL "$ANIME_EN" -o public/social/daily/en/anime.jpg
          curl --retry 3 --retry-delay 2 -fL "$ANIME_AR" -o public/social/daily/ar/anime.jpg
          curl --retry 3 --retry-delay 2 -fL "$MOVIE_EN" -o public/social/daily/en/movie.jpg
          curl --retry 3 --retry-delay 2 -fL "$MOVIE_AR" -o public/social/daily/ar/movie.jpg

      - name: Verify downloaded images
        run: |
          for file in \
            public/social/daily/en/series.jpg \
            public/social/daily/ar/series.jpg \
            public/social/daily/en/anime.jpg \
            public/social/daily/ar/anime.jpg \
            public/social/daily/en/movie.jpg \
            public/social/daily/ar/movie.jpg
          do
            test -s "$file"
            file "$file" | grep -Eqi 'JPEG|PNG|WebP image data'
          done

          echo "✅ All 6 images downloaded and validated"

      - name: Commit images
        run: |
          git config user.name "cimaly-social-bot"
          git config user.email "actions@github.com"

          git add public/social/daily

          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Update Cimaly branded social visuals"
            git push origin HEAD:main
          fi
