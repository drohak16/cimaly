name: Import Cimaly ChatGPT Images And Publish

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cimaly-image-import-publish
  cancel-in-progress: false

jobs:
  import-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read selected content IDs
        run: |
          echo "SERIES_TMDB_ID=$(jq -r '.morning_series.tmdb_id' data/last-social-selection.json)" >> "$GITHUB_ENV"
          echo "ANIME_TMDB_ID=$(jq -r '.afternoon_anime.tmdb_id' data/last-social-selection.json)" >> "$GITHUB_ENV"
          echo "MOVIE_TMDB_ID=$(jq -r '.evening_movie.tmdb_id' data/last-social-selection.json)" >> "$GITHUB_ENV"

      - name: Read image pack metadata
        run: |
          echo "PACK_SERIES_TMDB_ID=$(jq -r '.series_tmdb_id' data/social-image-urls.json)" >> "$GITHUB_ENV"
          echo "PACK_ANIME_TMDB_ID=$(jq -r '.anime_tmdb_id' data/social-image-urls.json)" >> "$GITHUB_ENV"
          echo "PACK_MOVIE_TMDB_ID=$(jq -r '.movie_tmdb_id' data/social-image-urls.json)" >> "$GITHUB_ENV"
          echo "SERIES_EN=$(jq -r '.series_en' data/social-image-urls.json)" >> "$GITHUB_ENV"
          echo "SERIES_AR=$(jq -r '.series_ar' data/social-image-urls.json)" >> "$GITHUB_ENV"
          echo "ANIME_EN=$(jq -r '.anime_en' data/social-image-urls.json)" >> "$GITHUB_ENV"
          echo "ANIME_AR=$(jq -r '.anime_ar' data/social-image-urls.json)" >> "$GITHUB_ENV"
          echo "MOVIE_EN=$(jq -r '.movie_en' data/social-image-urls.json)" >> "$GITHUB_ENV"
          echo "MOVIE_AR=$(jq -r '.movie_ar' data/social-image-urls.json)" >> "$GITHUB_ENV"

      - name: Validate exact TMDB binding
        shell: bash
        run: |
          set -euo pipefail
          test "$PACK_SERIES_TMDB_ID" = "$SERIES_TMDB_ID" || { echo "❌ Series image pack TMDB ID mismatch"; exit 1; }
          test "$PACK_ANIME_TMDB_ID" = "$ANIME_TMDB_ID" || { echo "❌ Anime image pack TMDB ID mismatch"; exit 1; }
          test "$PACK_MOVIE_TMDB_ID" = "$MOVIE_TMDB_ID" || { echo "❌ Movie image pack TMDB ID mismatch"; exit 1; }

      - name: Validate ChatGPT image URLs
        shell: bash
        run: |
          set -euo pipefail
          for url in "$SERIES_EN" "$SERIES_AR" "$ANIME_EN" "$ANIME_AR" "$MOVIE_EN" "$MOVIE_AR"; do
            [ -n "$url" ] && [ "$url" != "null" ] || { echo "❌ Missing ChatGPT image URL"; exit 1; }
            case "$url" in
              http://*|https://*) ;;
              *) echo "❌ Invalid image URL: $url"; exit 1 ;;
            esac
          done

      - name: Download six ChatGPT visuals into GitHub
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/social/daily/en public/social/daily/ar
          curl --retry 3 --retry-delay 2 -fL "$SERIES_EN" -o "public/social/daily/en/series-${SERIES_TMDB_ID}.jpg"
          curl --retry 3 --retry-delay 2 -fL "$SERIES_AR" -o "public/social/daily/ar/series-${SERIES_TMDB_ID}.jpg"
          curl --retry 3 --retry-delay 2 -fL "$ANIME_EN" -o "public/social/daily/en/anime-${ANIME_TMDB_ID}.jpg"
          curl --retry 3 --retry-delay 2 -fL "$ANIME_AR" -o "public/social/daily/ar/anime-${ANIME_TMDB_ID}.jpg"
          curl --retry 3 --retry-delay 2 -fL "$MOVIE_EN" -o "public/social/daily/en/movie-${MOVIE_TMDB_ID}.jpg"
          curl --retry 3 --retry-delay 2 -fL "$MOVIE_AR" -o "public/social/daily/ar/movie-${MOVIE_TMDB_ID}.jpg"

      - name: Commit ChatGPT images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cimaly-social-bot"
          git config user.email "actions@github.com"
          git add -- public/social/daily
          if ! git diff --cached --quiet; then
            git commit -m "Import ChatGPT Cimaly visuals"
            git push origin HEAD:main
          fi

      - name: Set series anime carousel to 01:30 Istanbul
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/getNextIstanbulSchedule(0, 30)/getNextIstanbulSchedule(1, 30)/' scripts/publish-buffer-daily.js
          grep -q 'getNextIstanbulSchedule(1, 30)' scripts/publish-buffer-daily.js

      - name: Schedule Buffer posts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID_FACEBOOK: ${{ secrets.BUFFER_CHANNEL_ID_FACEBOOK }}
          BUFFER_CHANNEL_ID_INSTAGRAM: ${{ secrets.BUFFER_CHANNEL_ID_INSTAGRAM }}
        run: node scripts/publish-buffer-daily.js
