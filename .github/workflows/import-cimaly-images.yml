name: Import Cimaly Images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read image URLs
        id: urls
        run: |
          echo "SERIES_EN=$(jq -r '.series_en' data/social-image-urls.json)" >> $GITHUB_ENV
          echo "SERIES_AR=$(jq -r '.series_ar' data/social-image-urls.json)" >> $GITHUB_ENV
          echo "ANIME_EN=$(jq -r '.anime_en' data/social-image-urls.json)" >> $GITHUB_ENV
          echo "ANIME_AR=$(jq -r '.anime_ar' data/social-image-urls.json)" >> $GITHUB_ENV
          echo "MOVIE_EN=$(jq -r '.movie_en' data/social-image-urls.json)" >> $GITHUB_ENV
          echo "MOVIE_AR=$(jq -r '.movie_ar' data/social-image-urls.json)" >> $GITHUB_ENV

      - name: Validate URLs
        run: |
          for url in \
            "$SERIES_EN" \
            "$SERIES_AR" \
            "$ANIME_EN" \
            "$ANIME_AR" \
            "$MOVIE_EN" \
            "$MOVIE_AR"
          do
            if [ -z "$url" ] || [ "$url" = "null" ]; then
              echo "Missing image URL"
              exit 1
            fi
          done

      - name: Create folders
        run: |
          mkdir -p public/social/daily/en
          mkdir -p public/social/daily/ar

      - name: Download Cimaly images
        run: |
          curl -fL "$SERIES_EN" -o public/social/daily/en/series.jpg
          curl -fL "$SERIES_AR" -o public/social/daily/ar/series.jpg

          curl -fL "$ANIME_EN" -o public/social/daily/en/anime.jpg
          curl -fL "$ANIME_AR" -o public/social/daily/ar/anime.jpg

          curl -fL "$MOVIE_EN" -o public/social/daily/en/movie.jpg
          curl -fL "$MOVIE_AR" -o public/social/daily/ar/movie.jpg

      - name: Verify downloaded images
        run: |
          test -s public/social/daily/en/series.jpg
          test -s public/social/daily/ar/series.jpg
          test -s public/social/daily/en/anime.jpg
          test -s public/social/daily/ar/anime.jpg
          test -s public/social/daily/en/movie.jpg
          test -s public/social/daily/ar/movie.jpg

          echo "✅ All 6 images downloaded"

      - name: Commit images
        run: |
          git config user.name "cimaly-social-bot"
          git config user.email "actions@github.com"

          git add public/social/daily

          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Update Cimaly branded social visuals"
            git push
          fi
