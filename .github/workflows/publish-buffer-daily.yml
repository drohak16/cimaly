name: Publish Cimaly Best Method HD
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data/publish-trigger.txt]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install HD tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick fonts-dejavu-core
      - name: Build six original Cimaly HD posters
        shell: bash
        run: |
          set -euo pipefail
          OUT="public/social/cimaly-2026-09-27-hd"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          render() {
            out="$1"; category="$2"; title="$3"; cta="$4"; accent="$5"; mode="$6"
            case "$mode" in
              movie)  bg1="#160b12"; bg2="#3a1020" ;;
              series) bg1="#07131f"; bg2="#12375a" ;;
              anime)  bg1="#11102a"; bg2="#3b1765" ;;
            esac

            convert -size 2160x2700 gradient:"$bg1-$bg2" \
              -fill 'rgba(255,255,255,0.025)' -draw 'circle 1760,420 2260,420' \
              -fill 'rgba(255,255,255,0.035)' -draw 'circle 250,2240 900,2240' \
              -stroke "$accent" -strokewidth 7 -fill none -draw 'line 150,400 2010,400' \
              -stroke 'rgba(255,255,255,0.12)' -strokewidth 3 -draw 'line 150,2120 2010,2120' \
              -font DejaVu-Sans-Bold -gravity north -fill white -pointsize 96 -annotate +0+105 'CIMALY' \
              -font DejaVu-Sans -fill "$accent" -pointsize 48 -annotate +0+255 "$category" \
              -gravity center -font DejaVu-Sans-Bold -fill white -stroke '#000000' -strokewidth 2 -pointsize 110 -annotate +0-40 "$title" \
              -stroke none -gravity south -font DejaVu-Sans -fill white -pointsize 50 -annotate +0+240 "$cta" \
              -fill "$accent" -pointsize 40 -annotate +0+145 'cimaly.cc' \
              -filter Lanczos -resize '1080x1350!' -unsharp 0x0.7+0.7+0.008 -colorspace sRGB -quality 96 -sampling-factor 4:4:4 "$out"
          }

          render "$OUT/film-en.jpg"   "MOVIE"  $'WHY DID I GET\nMARRIED AGAIN?' "WATCH NOW" "#ff334e" movie
          render "$OUT/film-ar.jpg"   "فيلم"   $'WHY DID I GET\nMARRIED AGAIN?' "شاهد الآن" "#ff334e" movie
          render "$OUT/series-en.jpg" "SERIES" "REACHER" "WATCH NOW" "#35a7ff" series
          render "$OUT/series-ar.jpg" "مسلسل"  "REACHER" "شاهد الآن" "#35a7ff" series
          render "$OUT/anime-en.jpg"  "ANIME"  "JUJUTSU KAISEN" "WATCH NOW" "#b879ff" anime
          render "$OUT/anime-ar.jpg"  "أنمي"   "JUJUTSU KAISEN" "شاهد الآن" "#b879ff" anime

          identify "$OUT"/*.jpg
      - name: Commit HD assets
        run: |
          git config user.name "cimaly-social-bot"
          git config user.email "actions@github.com"
          git add public/social/cimaly-2026-09-27-hd
          if ! git diff --cached --quiet; then
            git commit -m "Generate Cimaly Best Method HD assets for Sep 27"
            git push origin HEAD:main
          fi
      - name: Verify all six public URLs
        run: |
          sleep 10
          BASE="https://raw.githubusercontent.com/drohak16/cimaly/main/public/social/cimaly-2026-09-27-hd"
          for name in film-en film-ar series-en series-ar anime-en anime-ar; do
            curl -fL --retry 5 --retry-delay 2 "$BASE/$name.jpg" -o /dev/null
          done
      - name: Publish 3 bilingual posts in Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID_FACEBOOK: ${{ secrets.BUFFER_CHANNEL_ID_FACEBOOK }}
          BUFFER_CHANNEL_ID_INSTAGRAM: ${{ secrets.BUFFER_CHANNEL_ID_INSTAGRAM }}
        run: node scripts/publish-buffer-daily.js
