name: Publish Cimaly Best Method HD
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data/publish-trigger.txt]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install HD tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick fonts-noto-core fonts-dejavu-core
      - name: Build six HD masters
        run: node scripts/render-best-method-hd.js
      - name: Export optimized 1080x1350 JPGs
        run: |
          set -euo pipefail
          SRC="public/social/cimaly-2026-08-27-1900-hd/source"
          OUT="public/social/cimaly-2026-08-27-1900-hd"
          TMP="/tmp/cimaly-hd"
          mkdir -p "$OUT" "$TMP"
          for name in film-en film-ar series-en series-ar anime-en anime-ar; do
            rsvg-convert -w 2160 -h 2700 "$SRC/$name.svg" -o "$TMP/$name-master.png"
            convert "$TMP/$name-master.png" -filter Lanczos -resize '1080x1350!' -colorspace sRGB -quality 98 -sampling-factor 4:4:4 "$OUT/$name.jpg"
          done
      - name: Commit HD assets
        run: |
          git config user.name "cimaly-social-bot"
          git config user.email "actions@github.com"
          git add public/social/cimaly-2026-08-27-1900-hd
          if ! git diff --cached --quiet; then git commit -m "Render Cimaly 19h Best Method HD assets" && git push origin HEAD:main; fi
      - name: Verify all six public URLs
        run: |
          sleep 8
          BASE="https://raw.githubusercontent.com/drohak16/cimaly/main/public/social/cimaly-2026-08-27-1900-hd"
          for name in film-en film-ar series-en series-ar anime-en anime-ar; do curl -fL --retry 5 --retry-delay 2 "$BASE/$name.jpg" -o /dev/null; done
      - name: Publish 3 bilingual posts in Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID_FACEBOOK: ${{ secrets.BUFFER_CHANNEL_ID_FACEBOOK }}
          BUFFER_CHANNEL_ID_INSTAGRAM: ${{ secrets.BUFFER_CHANNEL_ID_INSTAGRAM }}
        run: node scripts/publish-buffer-daily.js
