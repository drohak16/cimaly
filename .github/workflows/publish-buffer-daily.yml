name: Publish Final Cimaly Posts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - data/publish-trigger.txt

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libheif-examples

      - name: Render the six final Cimaly images
        run: |
          set -euo pipefail
          SRC="public/social/cimaly-2026-08-23/source"
          OUT="public/social/cimaly-2026-08-23"
          TMP="/tmp/cimaly-final"
          mkdir -p "$OUT" "$TMP"

          for name in series-en series-ar anime-en anime-ar film-en film-ar; do
            heif-convert "$SRC/$name.avif" "$TMP/$name.png"
            convert "$TMP/$name.png" -resize '1080x1350!' -quality 92 "$OUT/$name.jpg"
          done

      - name: Commit final JPG social images
        run: |
          set -euo pipefail
          git config user.name "cimaly-social-bot"
          git config user.email "actions@github.com"
          git add public/social/cimaly-2026-08-23/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Render final Cimaly social JPGs"
            git push origin HEAD:main
          fi

      - name: Verify all six public image URLs
        run: |
          set -euo pipefail
          sleep 10
          BASE="https://raw.githubusercontent.com/drohak16/cimaly/main/public/social/cimaly-2026-08-23"
          for name in series-en series-ar anime-en anime-ar film-en film-ar; do
            curl -fL --retry 5 --retry-delay 3 "$BASE/$name.jpg" -o /dev/null
          done

      - name: Publish Cimaly posts to Buffer at 03:30 Istanbul
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID_FACEBOOK: ${{ secrets.BUFFER_CHANNEL_ID_FACEBOOK }}
          BUFFER_CHANNEL_ID_INSTAGRAM: ${{ secrets.BUFFER_CHANNEL_ID_INSTAGRAM }}
        run: node scripts/publish-buffer-daily.js
