name: Show Buffer Channels

on:
  workflow_dispatch:

jobs:
  show-channels:
    runs-on: ubuntu-latest

    steps:
      - name: Get Buffer channels
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          node - <<'NODE'

          async function queryBuffer(query) {
            const response = await fetch("https://api.buffer.com", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${process.env.BUFFER_API_KEY}`
              },
              body: JSON.stringify({ query })
            });

            const data = await response.json();

            if (!response.ok) {
              console.error(data);
              process.exit(1);
            }

            return data;
          }

          // STEP 1 — Get organization
          const orgData = await queryBuffer(`
            query {
              account {
                organizations {
                  id
                  name
                }
              }
            }
          `);

          console.log("BUFFER ORGANIZATIONS:");
          console.log(JSON.stringify(orgData, null, 2));

          const organizations = orgData?.data?.account?.organizations;

          if (!organizations || organizations.length === 0) {
            console.error("No Buffer organization found.");
            process.exit(1);
          }

          const organizationId = organizations[0].id;

          console.log("");
          console.log("ORGANIZATION ID:");
          console.log(organizationId);

          // STEP 2 — Get channels
          const channelData = await queryBuffer(`
            query GetChannels {
              channels(
                input: {
                  organizationId: "${organizationId}"
                }
              ) {
                id
                name
                displayName
                service
                type
              }
            }
          `);

          console.log("");
          console.log("==============================");
          console.log("BUFFER CHANNELS");
          console.log("==============================");
          console.log(JSON.stringify(channelData, null, 2));

          NODE
